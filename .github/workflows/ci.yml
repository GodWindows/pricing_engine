name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: C++ unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Python bindings smoke test
        run: |
          PYTHONPATH=build python - <<'PY'
          import pricing_engine as pe
          call = pe.EuropeanOption(100, 1.0, pe.OptionType.Call)
          market = pe.MarketData(100, 0.2, 0.05)
          bs = pe.price(call, market).price
          mc = pe.price_mc(call, market, 200_000, seed=42)
          print(f"Black-Scholes {bs:.4f} | Monte Carlo {mc:.4f}")
          assert abs(bs - 10.4506) < 1e-4
          assert abs(mc - bs) < 0.1
          PY
